[build]
# Railway uses backend/nixpacks.toml, which pins Node 24 and npm 11.
builder = "NIXPACKS"
rootDirectory = "backend"
watchPaths = ["backend/**"]

[deploy]
# Bootstrap and ordered migrations share one PostgreSQL advisory lock, so
# concurrent Railway starts serialize schema deployment.
startCommand = "npm run migrate:deploy && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 120
