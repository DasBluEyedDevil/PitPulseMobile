# Root-level Nixpacks fallback config.
# Railway is configured with rootDirectory = "backend", so the backend/nixpacks.toml
# is the authoritative config. This file is kept as a fallback only.

[phases.setup]
# nodejs_24 includes npm 11; do not add a separate npm derivation.
nixPkgs = ["nodejs_24"]

[phases.install]
cmds = ["(cd backend && npm ci --include=dev)"]

[phases.build]
cmds = ["(cd backend && npm run build)"]
